# Builds the Windows installer, installs it on a clean Windows machine and tests it there
# (fresh install, first-run setup, update over it, the automatic updater, uninstall).
# A tag like v1.2.0 also publishes it as a GitHub release, which every shop server's automatic
# updater picks up (latest.json + the installer).
name: Windows installer

on:
  push:
    tags: ['v*']
    branches: [main, 'claude/**']
    paths:
      - 'installer/**'
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/installer.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release v<package.json version> (from main, after the Windows tests pass)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aruna/server db:generate
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - run: pnpm typecheck
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem installer/windows/tools/*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "$($f.Name): $($e.Message) (line $($e.Extent.StartLineNumber))"; $bad++ }
          }
          if ($bad) { exit 1 }
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build the installer
        run: node installer/build.mjs
      - name: Release notes (docs/releases/<version>.md, shown in the shops' update pop-up)
        run: |
          f="docs/releases/$(node -p "require('./package.json').version").md"
          if [ -f "$f" ]; then cp "$f" dist/notes.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/*.sha256
            dist/latest.json
            dist/notes.md
          retention-days: 14

  test-on-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Fresh install (silent)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/ArunaPOS-Setup-*.exe).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          Get-Service ArunaPOS-DB, ArunaPOS-Server | Format-Table -AutoSize
      - name: The server answers with an empty database (first-run wizard)
        shell: pwsh
        run: |
          $version = (Get-Content dist/latest.json | ConvertFrom-Json).version
          $h = Invoke-RestMethod http://127.0.0.1:3000/api/health
          if ($h.version -ne $version) { throw "health says $($h.version), expected $version" }
          $s = Invoke-RestMethod http://127.0.0.1:3000/api/setup/status
          if (-not $s.needsSetup) { throw 'a fresh install should wait for the first-run wizard' }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3000/
          if ($page.Content -notmatch '<div id="root">') { throw 'the screens are not served' }
      - name: First-run setup makes the owner's account only
        shell: pwsh
        run: |
          $body = @{ shop = @{ shopName = 'Test shop' }; admin = @{ username = 'owner'; fullName = 'Owner'; password = 'password123'; pin = '1111' } } | ConvertTo-Json -Depth 5
          $r = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:3000/api/setup
          if ($r.recoveryCodes.Count -ne 8) { throw 'setup did not finish' }
          $login = @{ username = 'owner'; password = 'password123' } | ConvertTo-Json
          $null = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $login -SessionVariable web http://127.0.0.1:3000/api/auth/login
          $users = Invoke-RestMethod -WebSession $web http://127.0.0.1:3000/api/users
          "Users: $($users.items.Count)"
          if ($users.items.Count -ne 1) { throw 'only the owner should exist' }
      - name: Run the installer again (update path keeps the data)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/ArunaPOS-Setup-*.exe).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $result = Get-Content C:\ProgramData\ArunaPOS\data\updates\last-result.json | ConvertFrom-Json
          $result
          if (-not $result.ok) { throw 'update failed' }
          $backup = Get-ChildItem C:\ProgramData\ArunaPOS\data\backups\before-update-*.dump
          if (-not $backup) { throw 'no backup was made before the update' }
          $login = @{ username = 'owner'; password = 'password123' } | ConvertTo-Json
          $null = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $login http://127.0.0.1:3000/api/auth/login
      - name: The automatic updater task runs a downloaded installer
        shell: pwsh
        run: |
          $updates = 'C:\ProgramData\ArunaPOS\data\updates'
          Remove-Item "$updates\last-result.json" -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem dist/ArunaPOS-Setup-*.exe)
          Copy-Item $exe.FullName "$updates\$($exe.Name)"
          $sha = (Get-FileHash "$updates\$($exe.Name)" -Algorithm SHA256).Hash.ToLower()
          $version = (Get-Content dist/latest.json | ConvertFrom-Json).version
          @{ version = $version; from = $version; installer = "$updates\$($exe.Name)"; sha256 = $sha } | ConvertTo-Json | Set-Content "$updates\pending.json"
          schtasks.exe /Run /TN "Aruna POS Updater"
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path "$updates\last-result.json") -and (Get-Date) -lt $deadline) { Start-Sleep 5 }
          $r = Get-Content "$updates\last-result.json" | ConvertFrom-Json
          $r
          if (-not $r.ok) { throw 'the updater task did not update' }
          $null = Invoke-RestMethod http://127.0.0.1:3000/api/health
      - name: Uninstall keeps the shop's data
        shell: pwsh
        run: |
          $dir = 'C:\Program Files\Aruna POS'
          $p = Start-Process -FilePath "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          if (Get-Service ArunaPOS-Server -ErrorAction SilentlyContinue) { throw 'the server service is still there' }
          if (-not (Test-Path C:\ProgramData\ArunaPOS\pgdata\PG_VERSION)) { throw 'the data should be kept' }
      - name: Reinstall over the kept data
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/ArunaPOS-Setup-*.exe).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
          $login = @{ username = 'owner'; password = 'password123' } | ConvertTo-Json
          $null = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $login http://127.0.0.1:3000/api/auth/login
          'The owner signs in after the reinstall.'
      - name: Show the setup logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem C:\ProgramData\ArunaPOS\logs -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name)"
            Get-Content $_.FullName -Tail 120
          }
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: C:\ProgramData\ArunaPOS\logs
          if-no-files-found: ignore

  # Update tests: older -> newer with a database change, a failing database change, a server that
  # won't start, then a normal update to this build. Every release must pass them.
  build-update-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - name: Build the test installers (0.9.x, never published)
        env:
          NSIS_FAST: '1'
        run: |
          VERSION_OVERRIDE=0.9.0 node installer/build.mjs
          SKIP_WEB_BUILD=1 VERSION_OVERRIDE=0.9.1 TEST_VARIANT=good-migration node installer/build.mjs
          SKIP_WEB_BUILD=1 VERSION_OVERRIDE=0.9.2 TEST_VARIANT=bad-migration node installer/build.mjs
          SKIP_WEB_BUILD=1 VERSION_OVERRIDE=0.9.3 TEST_VARIANT=broken-server node installer/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: update-test-installers
          path: dist/ArunaPOS-Setup-0.9.*.exe
          retention-days: 7

  test-updates-on-windows:
    needs: [build, build-update-tests]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: update-test-installers
          path: tests
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Test helpers
        shell: pwsh
        run: |
          @'
          $ErrorActionPreference = 'Stop'
          $Updates = 'C:\ProgramData\ArunaPOS\data\updates'
          function Setup-Exe([string]$version) { (Get-ChildItem "$env:GITHUB_WORKSPACE\tests\ArunaPOS-Setup-$version.exe").FullName }
          function Run-Installer([string]$exe) {
            $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
            "Installer $([IO.Path]::GetFileName($exe)) exit code: $($p.ExitCode)"
            return $p.ExitCode
          }
          function Wait-Version([string]$v, [int]$seconds = 120) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try { if ((Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:3000/api/health).version -eq $v) { return } } catch { }
              Start-Sleep 2
            }
            throw "The server did not answer as version $v"
          }
          function Sign-In {
            $login = @{ username = 'owner'; password = 'password123' } | ConvertTo-Json
            $null = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $login -SessionVariable web http://127.0.0.1:3000/api/auth/login
            return $web
          }
          function Db([string]$sql) {
            $line = Get-Content C:\ProgramData\ArunaPOS\config.env | Where-Object { $_ -like 'DATABASE_URL=*' }
            $url = ($line -replace "^DATABASE_URL='?", '' -replace "'$", '') -replace '\?.*$', ''
            $out = & 'C:\Program Files\Aruna POS\pgsql\bin\psql.exe' $url -At -c $sql
            if ($LASTEXITCODE -ne 0) { throw "psql failed: $sql" }
            return ($out -join "`n").Trim()
          }
          # The result file; a server that started after it may already have renamed it.
          function Last-Result {
            $f = Get-ChildItem "$Updates\last-result.json", "$Updates\last-result.reported.json" -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $f) { return $null }
            return Get-Content $f.FullName -Raw | ConvertFrom-Json
          }
          function Clear-Result { Remove-Item "$Updates\last-result.json", "$Updates\last-result.reported.json" -ErrorAction SilentlyContinue }
          function Supplier-Count {
            $web = Sign-In
            return (Invoke-RestMethod -WebSession $web 'http://127.0.0.1:3000/api/suppliers?q=Update%20Test').items.Count
          }
          '@ | Set-Content "$env:RUNNER_TEMP\t.ps1"
      - name: Install the older version 0.9.0 and put data in
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          if ((Run-Installer (Setup-Exe '0.9.0')) -ne 0) { exit 1 }
          Wait-Version '0.9.0'
          $body = @{ shop = @{ shopName = 'Update test shop' }; admin = @{ username = 'owner'; fullName = 'Owner'; password = 'password123'; pin = '1111' } } | ConvertTo-Json -Depth 5
          $null = Invoke-RestMethod -Method Post -ContentType 'application/json' -Body $body http://127.0.0.1:3000/api/setup
          $web = Sign-In
          $s = @{ name = 'Update Test Supplier'; phones = @('0771234567') } | ConvertTo-Json
          $null = Invoke-RestMethod -WebSession $web -Method Post -ContentType 'application/json' -Body $s http://127.0.0.1:3000/api/suppliers
          if ((Supplier-Count) -ne 1) { throw 'the supplier was not saved' }
      - name: Update with a database change (0.9.1) keeps the data
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          Clear-Result
          if ((Run-Installer (Setup-Exe '0.9.1')) -ne 0) { exit 1 }
          Wait-Version '0.9.1'
          $r = Last-Result; $r
          if (-not $r.ok -or $r.from -ne '0.9.0' -or $r.version -ne '0.9.1') { throw 'expected a successful update from 0.9.0' }
          if ((Db "SELECT note FROM update_test_marker WHERE id = 1") -ne 'applied') { throw 'the database change was not applied' }
          if ((Supplier-Count) -ne 1) { throw 'the data was lost' }
      - name: A failing database change (0.9.2, through the updater task) is rolled back
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          Clear-Result
          $exe = Get-Item (Setup-Exe '0.9.2')
          Copy-Item $exe.FullName "$Updates\$($exe.Name)"
          $sha = (Get-FileHash "$Updates\$($exe.Name)" -Algorithm SHA256).Hash.ToLower()
          @{ version = '0.9.2'; from = '0.9.1'; installer = "$Updates\$($exe.Name)"; sha256 = $sha } | ConvertTo-Json | Set-Content "$Updates\pending.json"
          schtasks.exe /Run /TN "Aruna POS Updater"
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Last-Result) -and (Get-Date) -lt $deadline) { Start-Sleep 5 }
          $r = Last-Result; $r
          if ($null -eq $r -or $r.ok) { throw 'the failing update should have been reported as failed' }
          Wait-Version '0.9.1'
          if ((Db "SELECT to_regclass('public.update_test_half') IS NULL") -ne 't') { throw 'the half-applied change is still in the database' }
          if ((Db "SELECT count(*) FROM _prisma_migrations WHERE migration_name LIKE '29990102%'") -ne '0') { throw 'the failed change is recorded as applied' }
          if ((Db "SELECT note FROM update_test_marker WHERE id = 1") -ne 'applied') { throw 'the earlier change was lost' }
          if ((Supplier-Count) -ne 1) { throw 'the data was lost' }
      - name: A server that won't start (0.9.3) is rolled back
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          Clear-Result
          if ((Run-Installer (Setup-Exe '0.9.3')) -eq 0) { throw 'the installer should report the failed update' }
          $r = Last-Result; $r
          if ($null -eq $r -or $r.ok -or $r.message -notmatch 'did not answer') { throw 'expected "did not answer"' }
          Wait-Version '0.9.1'
          if ((Supplier-Count) -ne 1) { throw 'the data was lost' }
      - name: The failed updates show in the app (alerts and audit log)
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          $web = Sign-In
          $deadline = (Get-Date).AddMinutes(2)
          do {
            $alerts = (Invoke-RestMethod -WebSession $web http://127.0.0.1:3000/api/alerts).items | Where-Object { $_.kind -eq 'UPDATE_FAILED' }
            if ($alerts.Count -ge 2) { break }
            Start-Sleep 10
          } while ((Get-Date) -lt $deadline)
          $alerts | Format-List message
          if ($alerts.Count -lt 2) { throw 'both failed updates should show as alerts' }
      - name: After the failures, a normal update to this build still works
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\t.ps1"
          Clear-Result
          $exe = (Get-ChildItem dist/ArunaPOS-Setup-*.exe).FullName
          $version = (Get-Content dist/latest.json | ConvertFrom-Json).version
          if ((Run-Installer $exe) -ne 0) { exit 1 }
          Wait-Version $version
          $r = Last-Result; $r
          if (-not $r.ok) { throw 'the update to this build failed' }
          if ((Supplier-Count) -ne 1) { throw 'the data was lost' }
          if (Get-ChildItem 'C:\Program Files\Aruna POS\*.prev' -ErrorAction SilentlyContinue) { throw 'old .prev folders were left behind' }
      - name: Show the logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem C:\ProgramData\ArunaPOS\logs -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name)"
            Get-Content $_.FullName -Tail 60
          }

  release:
    # A pushed v* tag, or "Run workflow" on main with publish ticked (the release makes the tag).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: [test-on-windows, test-updates-on-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: Publish the release (shop servers update from it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version dist/latest.json)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "$tag" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} but the installer is $tag"; exit 1
          fi
          notes="Windows installer for the shop server. New installs: download ArunaPOS-Setup-${tag#v}.exe and run it. Shops already installed are asked when to install it."
          if [ -f dist/notes.md ]; then notes="$(cat dist/notes.md)"; rm dist/notes.md; fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Aruna POS ${tag#v}" \
            --notes "$notes"
